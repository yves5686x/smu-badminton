services:
  smu-badminton:
    build: .
    container_name: smu-badminton
    restart: unless-stopped

    # 端口只有一个旋钮：改 SERVER_PORT（或在 shell 里 export）即可同时作用于
    # 监听端口、端口映射与健康检查。镜像内 HEALTHCHECK 也读这个变量。
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"

    volumes:
      # 数据库持久化（Docker volume，不同步到本地）
      - smu-badminton-data:/app/data
      # 部署配置（L2）：只读挂载——运行时可变配置走数据库 app_settings（L3），
      # 不再由服务进程改写这个文件。
      - ./.env:/app/.env:ro

    # L1：进程环境变量优先于 .env
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - SERVER_PORT=${SERVER_PORT:-5000}
      - DATA_DIR=/app/data

volumes:
  smu-badminton-data:
